[package]
name = "rereader"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "GPL-3.0-only"
description = "rereader: a Slint-based reader for Kindle and desktop"

[features]
default = ["desktop"]
desktop = ["slint/backend-winit"]
kindle = ["dep:slint-backend-kindle"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "renderer-software", "compat-1-2"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt", "net", "time", "sync", "macros"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
rand = "0.9"
qrcode = { version = "0.14", default-features = false }
futures-util = "0.3"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "webp"] }

[dev-dependencies]
ttf-parser = "0.25"

[build-dependencies]
slint-build = "=1.18.1"

[target.'cfg(target_os = "linux")'.dependencies]
slint-backend-kindle = { version = "=0.7.1", optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
