[package]
name = "rereader"
version = "0.1.0"
edition = "2021"
rust-version = "1.92"
license = "MIT"
description = "rereader: a Slint-based reader for Kindle and desktop"

[features]
default = ["desktop"]
desktop = ["slint/backend-winit"]
kindle = ["dep:slint-backend-kindle"]

[dependencies]
slint = { version = "=1.18.1", default-features = false, features = ["std", "renderer-software", "compat-1-2"] }

[build-dependencies]
slint-build = "=1.18.1"

[target.'cfg(target_os = "linux")'.dependencies]
slint-backend-kindle = { version = "=0.7.1", optional = true }

[profile.release]
lto = true
codegen-units = 1
strip = true
panic = "abort"
